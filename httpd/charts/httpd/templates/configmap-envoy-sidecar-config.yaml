apiVersion: v1
kind: ConfigMap
metadata:
  name: envoy-sidecar-config
data:
  envoy.yaml: |
    # 1. Overload Manager (Memory & Connection Safety)
    # Edge best practice: Always configure an overload manager to protect the proxy from 
    # resource exhaustion.
    overload_manager:
      refresh_interval: 0.25s
      resource_monitors:
        - name: "envoy.resource_monitors.fixed_heap"
          typed_config:
            "@type": type.googleapis.com/envoy.extensions.resource_monitors.fixed_heap.v3.FixedHeapConfig
            max_heap_size_bytes: 1073741824 # 1 GiB
        - name: "envoy.resource_monitors.global_downstream_max_connections"
          typed_config:
            "@type": type.googleapis.com/envoy.extensions.resource_monitors.downstream_connections.v3.DownstreamConnectionsConfig
            max_active_downstream_connections: 1000

    # 2. Administrative Interface
    admin:
      address:
        socket_address: { address: 0.0.0.0, port_value: 15000 }

    static_resources:
      listeners:
      - name: listener_0
        address:
          socket_address: { address: 0.0.0.0, port_value: 8081 }
        # Edge best practice: Limit buffer sizes to 32 KiB to prevent memory bloat.
        per_connection_buffer_limit_bytes: 32768 
        filter_chains:
        - filters:
          - name: envoy.filters.network.http_connection_manager
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
              stat_prefix: ingress_http
              
              # Edge best practice: Enable path normalization to prevent path confusion vulnerabilities.
              normalize_path: true
              merge_slashes: true
              path_with_escaped_slashes_action: UNESCAPE_AND_REDIRECT
              
              # Edge best practice: Set use_remote_address to true to properly handle downstream headers.
              use_remote_address: true
              
              common_http_protocol_options:
                idle_timeout: 60s
                max_connection_duration: 300s
                # Edge best practice: Reject requests with underscores in headers to protect upstream.
                headers_with_underscores_action: REJECT_REQUEST

              http2_protocol_options:
                max_concurrent_streams: 100
                initial_stream_window_size: 65536 # 64 KiB
                initial_connection_window_size: 1048576 # 1 MiB

              internal_address_config:
                cidr_ranges:
                  - address_prefix: "10.217.0.0"
                    prefix_len: 22
                  - address_prefix: "10.217.4.0"
                    prefix_len: 23
                  - address_prefix: "127.0.0.1"
                    prefix_len: 32

              server_header_transformation: PASS_THROUGH
              
              access_log:
              - name: envoy.access_loggers.stdout
                typed_config:
                  "@type": type.googleapis.com/envoy.extensions.access_loggers.stream.v3.StdoutAccessLog

              http_filters:
              - name: envoy.filters.http.lua
                typed_config:
                  "@type": type.googleapis.com/envoy.extensions.filters.http.lua.v3.Lua
                  default_source_code:
                    inline_string: |
                      function envoy_on_response(response_handle)
                        -- Your existing Lua security header logic remains here
                      end
              
              - name: envoy.filters.http.router
                typed_config:
                  "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router
              
              route_config:
                name: local_route
                response_headers_to_remove:
                  - "x-envoy-upstream-service-time"
                  - "server"
                virtual_hosts:
                - name: local_service
                  domains: ["*"]
                  routes:
                  - match: { prefix: "/" }
                    route: 
                      cluster: apache_service
                      timeout: 15s # Explicit timeout for reliability

      clusters:
      - name: apache_service
        connect_timeout: 0.5s
        type: STATIC
        lb_policy: ROUND_ROBIN
        # Edge best practice: Limit upstream buffer sizes.
        per_connection_buffer_limit_bytes: 32768
        load_assignment:
          cluster_name: apache_service
          endpoints:
          - lb_endpoints:
            - endpoint:
                address:
                  socket_address: { address: 127.0.0.1, port_value: 8080 }
