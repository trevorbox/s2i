apiVersion: v1
kind: Service
metadata:
  name: {{ include "httpd.fullname" . }}
  labels:
    {{- include "httpd.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    # - port: {{ .Values.service.port }}
    - port: {{ .Values.sidecar.port }}
      # targetPort: http
      targetPort: http-envoy
      protocol: TCP
      # name: http
      name: http-envoy
  selector:
    {{- include "httpd.selectorLabels" . | nindent 4 }}
