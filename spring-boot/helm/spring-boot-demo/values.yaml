# Default values for spring-boot-demo.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

replicaCount: 1

# Must exceed app preStop sleep + spring.lifecycle.timeout-per-shutdown-phase (30s).
terminationGracePeriodSeconds: 40

# A Ready replacement must exist before the old pod is deleted.
rollingUpdate:
  maxUnavailable: 0
  maxSurge: 1

image:
  repository: quay.io/trevorbox/spring-boot-micro-jre
  pullPolicy: Always
  # Overrides the image tag whose default is the chart appVersion.
  tag: "latest"

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  # Specifies whether a service account should be created
  create: true
  # Annotations to add to the service account
  annotations: {}
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name: ""

podAnnotations: 
  prometheus.io/scrape: "true"
  prometheus.io/port: "8080"
  prometheus.io/path: "/actuator/prometheus"
  sidecar.istio.io/inject: "true"

podSecurityContext: {}
  # fsGroup: 2000

securityContext: {}
  # capabilities:
  #   drop:
  #   - ALL
  # readOnlyRootFilesystem: true
  # runAsNonRoot: true
  # runAsUser: 1000

# Fail /ready first (touch), then sleep for Istiod EDS. Sleep alone leaves Ready=true.
# Do not set holdApplicationUntilProxyStarts or terminationDrainDuration on this app.
lifecycle:
  preStop:
    exec:
      command: ["/bin/sh", "-c", "touch /tmp/unhealthy; sleep 5"]

startupProbe:
  httpGet:
    path: /live
    port: http
  periodSeconds: 2
  failureThreshold: 30

livenessProbe:
  httpGet:
    path: /live
    port: http
  periodSeconds: 5

readinessProbe:
  httpGet:
    path: /ready
    port: http
  periodSeconds: 1

service:
  type: ClusterIP
  port: 8080
  helloPort: 11174

ingress:
  enabled: false
  className: ""
  annotations: {}
    # kubernetes.io/ingress.class: nginx
    # kubernetes.io/tls-acme: "true"
  hosts:
    - host: chart-example.local
      paths:
        - path: /
          pathType: ImplementationSpecific
  tls: []
  #  - secretName: chart-example-tls
  #    hosts:
  #      - chart-example.local

resources: 
  # We usually recommend not to specify default resources and to leave this as a conscious
  # choice for the user. This also increases chances charts run on environments with little
  # resources, such as Minikube. If you do want to specify resources, uncomment the following
  # lines, adjust them as necessary, and remove the curly braces after 'resources:'.
  # limits:
  #   memory: 1Gi
  #   cpu: 500m
  # requests:
  #   cpu: 500m
  #   memory: 1Gi

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 100
  targetCPUUtilizationPercentage: 80
  # targetMemoryUtilizationPercentage: 80

nodeSelector: {}

tolerations: []

affinity: {}


istio:
  enabled: false
  envoyFilter:
    ignoreHttp11Upgrade:
      # Requires Envoy >= 1.34. Patches only this chart's pods via workloadSelector.
      enabled: false
      matchers:
        - prefix: TLS/
          ignore_case: true

ingressgateway:
  name: ingressgateway
  namespace: istio-ingress
context: 
  name: spring-boot-demo
  namespace: spring-boot-demo
