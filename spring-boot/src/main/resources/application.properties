spring.application.name=demo
hello.server.port=11174

# Native sidecar drain: keep serving in-flight work after SIGTERM, then exit.
# Timeout must fit in remaining pod grace after preStop (chart default 40s - 5s sleep).
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=30s

# preStop does `touch` on this path; /ready is 503 while the file exists (liveness stays up).
app.drain-flag-file=${DRAIN_FLAG_FILE:/tmp/unhealthy}

management.endpoints.web.exposure.include=health,prometheus
management.endpoint.health.probes.enabled=true
management.endpoint.health.probes.add-additional-paths=true
# Setting additional-path creates a custom group; include must stay probe-only
# or /live would also fail when the drain flag is set.
management.endpoint.health.group.liveness.include=livenessState
management.endpoint.health.group.liveness.additional-path=server:/live
management.endpoint.health.group.readiness.include=readinessState,drainFlag
management.endpoint.health.group.readiness.additional-path=server:/ready
management.metrics.distribution.percentiles-histogram.http.server.requests=true

# Join mesh traces (Boot consumes W3C, B3, and B3 multi). OTLP export is off until
# MANAGEMENT_TRACING_EXPORT_OTLP_ENABLED=true. Parent-based sampling still follows
# an unsampled traceparent from Istio. Metrics stay on the Prometheus scrape.
management.tracing.sampling.probability=1.0
management.tracing.export.otlp.enabled=false
management.otlp.metrics.export.enabled=false
management.opentelemetry.tracing.export.otlp.endpoint=${OTEL_EXPORTER_OTLP_TRACES_ENDPOINT:http://localhost:4318/v1/traces}
management.opentelemetry.resource-attributes.service.namespace=${POD_NAMESPACE:local}
management.opentelemetry.resource-attributes.k8s.pod.name=${POD_NAME:local}
# Original caller. Remote field is forwarded as W3C baggage; tag field copies it onto spans.
management.tracing.baggage.remote-fields=enduser.id
management.tracing.baggage.tag-fields=enduser.id
management.tracing.baggage.correlation.fields=enduser.id
logging.pattern.correlation=[${spring.application.name:},%X{traceId:-},%X{spanId:-},%X{enduser.id:-}] 
logging.include-application-name=false
